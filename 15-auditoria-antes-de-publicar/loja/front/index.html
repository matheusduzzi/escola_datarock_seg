<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loja Aurora</title>
<script src="/config.js"></script>
<style>
 body{font-family:system-ui,sans-serif;max-width:720px;margin:2rem auto;padding:0 1rem;color:#172322}
 li{margin:.3rem 0} input,button{font:inherit;padding:.3rem .5rem} .escondido{display:none}
</style>
</head>
<body>
<h1 id="nome">Loja Aurora</h1>
<form id="entrar"><input name="email" placeholder="e-mail"> <input name="senha" type="password" placeholder="senha"> <button>Entrar</button></form>
<p id="aviso"></p>
<p id="conta" class="escondido"></p>
<p><a id="link-guia" class="escondido" href="#">Guia de iluminação do Clube</a> <a id="link-painel" class="escondido" href="#">Painel da loja</a></p>
<form id="busca"><input name="busca" placeholder="buscar"> <select name="ordem"><option value="id">novidades</option><option value="nome">nome</option><option value="preco_centavos">menor preço</option></select> <button>Buscar</button></form>
<ul id="produtos"></ul>
<form id="assistente" class="escondido"><input name="pergunta" size="40" placeholder="pergunte ao assistente de iluminação"> <button>Perguntar</button></form>
<form id="newsletter"><input name="email" placeholder="seu e-mail"> <button>Quero a newsletter</button></form>
<pre id="saida"></pre>
<script>
document.getElementById('nome').textContent = window.AURORA.PUBLIC_LOJA_NOME;
let token = '';
let eu = null;

function reais(c) { return 'R$ ' + (c / 100).toFixed(2).replace('.', ','); }

// As regras do Clube e do crédito, como o agente escreveu: tudo calculado aqui no navegador.
function totalDoPedido(produto, quantidade) {
  const subtotal = produto.preco_centavos * quantidade;
  const desconto = eu && eu.plano === 'clube' ? Math.floor(subtotal * 10 / 100) : 0;
  const credito = eu ? Math.min(eu.credito_centavos, subtotal - desconto) : 0;
  return {subtotal, desconto, credito, total: subtotal - desconto - credito};
}

async function api(metodo, caminho, corpo) {
  const r = await fetch(caminho, {method: metodo, headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token},
                                  body: corpo ? JSON.stringify(corpo) : undefined});
  return [r.status, await r.json()];
}

async function comprar(produto) {
  const conta = totalDoPedido(produto, 1);
  const [status, pedido] = await api('POST', '/api/pedidos', {
    produto_id: produto.id, quantidade: 1, preco_centavos: produto.preco_centavos,
    plano: eu.plano, credito_centavos: conta.credito});
  document.getElementById('saida').textContent = status + ' ' + JSON.stringify(pedido, null, 2);
}

async function carregar(busca = '', ordem = 'id') {
  const [, dados] = await api('GET', '/api/produtos?busca=' + encodeURIComponent(busca) + '&ordem=' + ordem + '&limite=20');
  const ul = document.getElementById('produtos');
  ul.innerHTML = '';
  for (const p of dados.produtos || []) {
    const li = document.createElement('li');
    const conta = totalDoPedido(p, 1);
    li.textContent = p.nome + ': ' + reais(conta.total) + ' ';
    if (eu) { const b = document.createElement('button'); b.textContent = 'Comprar'; b.onclick = () => comprar(p); li.appendChild(b); }
    ul.appendChild(li);
  }
}

document.getElementById('entrar').addEventListener('submit', async e => {
  e.preventDefault();
  const [status, r] = await api('POST', '/api/login', {email: e.target.email.value, senha: e.target.senha.value});
  if (status !== 200) { document.getElementById('aviso').textContent = r.erro; return; }
  token = r.token;
  [, eu] = await api('GET', '/api/eu');
  document.getElementById('conta').textContent = eu.nome + ' · plano ' + eu.plano + ' · crédito ' + reais(eu.credito_centavos);
  document.getElementById('conta').classList.remove('escondido');
  // Quem não é do Clube nem é admin não vê os links. É isso que "protege" as duas rotas.
  if (eu.plano === 'clube') document.getElementById('link-guia').classList.remove('escondido');
  if (eu.papel === 'admin') document.getElementById('link-painel').classList.remove('escondido');
  document.getElementById('assistente').classList.remove('escondido');
  carregar();
});
document.getElementById('link-guia').onclick = async () => {
  const [s, r] = await api('GET', '/api/clube/guia?plano=' + eu.plano);
  document.getElementById('saida').textContent = s + ' ' + JSON.stringify(r, null, 2);
};
document.getElementById('link-painel').onclick = async () => {
  const [s, r] = await api('GET', '/api/admin/pedidos');
  document.getElementById('saida').textContent = s + ' ' + JSON.stringify(r, null, 2);
};
document.getElementById('busca').addEventListener('submit', e => {
  e.preventDefault();
  carregar(e.target.busca.value, e.target.ordem.value);
});
document.getElementById('assistente').addEventListener('submit', async e => {
  e.preventDefault();
  const [s, r] = await api('POST', '/api/assistente', {pergunta: e.target.pergunta.value});
  document.getElementById('saida').textContent = s + ' ' + (r.resposta || r.erro);
});
document.getElementById('newsletter').addEventListener('submit', async e => {
  e.preventDefault();
  const [s, r] = await api('POST', '/api/newsletter', {email: e.target.email.value});
  document.getElementById('saida').textContent = s + ' ' + (r.mensagem || r.erro);
});
carregar();
</script>
</body>
</html>
