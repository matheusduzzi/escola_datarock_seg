# O portão do PR no GitHub Actions: o mesmo papel do portao.py, num repositório seu no GitHub.
#
# Copie para .github/workflows/portao.yml no seu repositório. Depois, nas configurações da
# branch main, ligue "Require status checks before merging" e marque o check "portao": um PR
# com alguma etapa falhando fica sem botão de merge.
#
# Ferramentas e versões conferidas na documentação de cada uma em 09/11/2026:
# actions/checkout v7, actions/setup-python v7, gitleaks 8.30.1, pip-audit, Semgrep Community Edition.
# Este arquivo não roda no kit: lá, quem faz o papel dele é o portao.py.

name: portao

on:
  pull_request:

permissions:
  contents: read

jobs:
  portao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # o histórico inteiro: o gitleaks precisa ver cada commit do PR

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: segredos (gitleaks, em cada commit do PR)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          VERSAO: "8.30.1"
        run: |
          url="https://github.com/gitleaks/gitleaks/releases/download/v${VERSAO}"
          curl -sSfLO "${url}/gitleaks_${VERSAO}_linux_x64.tar.gz"
          curl -sSfLO "${url}/gitleaks_${VERSAO}_checksums.txt"
          grep "linux_x64.tar.gz" "gitleaks_${VERSAO}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${VERSAO}_linux_x64.tar.gz" gitleaks
          ./gitleaks git --log-opts="${BASE}..HEAD" -v .

      - name: dependências (pip-audit)
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install pip-audit
            pip-audit -r requirements.txt
          else
            echo "sem requirements.txt: nada a auditar"
          fi

      - name: código (Semgrep Community Edition)
        run: |
          python -m pip install semgrep
          semgrep scan --config p/python --error --metrics=off

      - name: testes
        run: python -m unittest
